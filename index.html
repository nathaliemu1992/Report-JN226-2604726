    <script type="text/javascript">
        // 设置 PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // rem 自适应布局
        (function () {
            if (document.documentElement.clientWidth >= 540) {
                document.documentElement.style.fontSize = 540 / 7.5 + 'px';
                document.documentElement.className = 'pc';
            } else {
                document.documentElement.style.fontSize = document.documentElement.clientWidth / 7.5 + 'px';
            }
        })();

        // 报告数据（纯前端内置，无需后端接口）
        var reportData = {
            testingInstituteName: "国家建筑工程材料质量检验检测中心",
            testingReportNo: "JN226-220454",
            testingOrderNo: "JN22-220466",
            reportDate: "2022-11-15",
            testingDate: "2022-10-08",
            unitName: "成都市金牛区清河防水材料厂",
            projectName: "无",
            projectSection: "无",
            sampleNo: "JN22-220466-01",
            sampleName: "PVC塑料地板胶",
            specificationModel: "GX360，水基型其他胶粘剂，P型",
            manufacturerName: "成都市金牛区清河防水材料厂",
            testingBasisItems: "《室内装饰装修材料 胶粘剂中有害物质限量》(（最新）)、《聚氯乙烯塑料地板胶粘剂》、《聚氯乙烯塑料地板胶粘剂》、《聚氯乙烯塑料地板胶粘剂》",
            isValid: true
        };

        // 页面加载完成后渲染
        document.addEventListener('DOMContentLoaded', function () {
            renderReport(reportData);
            initPdfViewer();
        });

        function renderReport(data) {
            // 报告有效性
            if (data.isValid) {
                document.getElementById('isDeleteOne').style.display = 'block';
                document.getElementById('isDeleteTwo').style.display = 'none';
            } else {
                document.getElementById('isDeleteOne').style.display = 'none';
                document.getElementById('isDeleteTwo').style.display = 'block';
            }

            document.getElementById('txt_testingInstituteName').textContent = data.testingInstituteName;
            document.getElementById('txt_testingReportNo').textContent = data.testingReportNo;
            document.getElementById('txt_testingOrderNo').textContent = data.testingOrderNo;
            document.getElementById('txt_reportDate').textContent = data.reportDate;
            document.getElementById('txt_testingDate').textContent = data.testingDate;
            document.getElementById('txt_unitName').textContent = data.unitName;
            document.getElementById('txt_projectName').textContent = data.projectName;
            document.getElementById('txt_projectSection').textContent = data.projectSection;
            document.getElementById('txt_sampleNo').textContent = data.sampleNo;
            document.getElementById('txt_sampleName').textContent = data.sampleName;
            document.getElementById('txt_specificationModel').textContent = data.specificationModel;
            document.getElementById('txt_manufacturerName').textContent = data.manufacturerName;
            document.getElementById('txt_testingBasisItems').textContent = data.testingBasisItems;
        }

        // PDF 预览功能
        var pdfDoc = null;
        var pdfLoaded = false;

        function initPdfViewer() {
            var downloadBtn = document.getElementById('downloadBtn');
            var pdfMask = document.getElementById('pdfMask');
            var closeBtn = document.getElementById('pdfCloseBtn');
            var pdfContainer = document.getElementById('pdfContainer');

            // 点击报告下载，打开 PDF 预览
            downloadBtn.addEventListener('click', function (e) {
                e.preventDefault();
                pdfMask.classList.add('show');
                document.body.style.overflow = 'hidden';
                if (!pdfLoaded) {
                    loadPdf();
                }
            });

            // 关闭预览
            closeBtn.addEventListener('click', function () {
                pdfMask.classList.remove('show');
                document.body.style.overflow = '';
            });
        }

        function loadPdf() {
            var pdfContainer = document.getElementById('pdfContainer');
            pdfContainer.innerHTML = '<div class="pdf-loading">正在加载报告...</div>';

            pdfjsLib.getDocument('report.pdf').promise.then(function (pdf) {
                pdfDoc = pdf;
                pdfLoaded = true;
                pdfContainer.innerHTML = '';
                renderAllPages(pdf);
            }).catch(function (err) {
                pdfContainer.innerHTML = '<div class="pdf-loading">报告加载失败，请稍后重试</div>';
                console.error(err);
            });
        }

        function renderAllPages(pdf) {
            var pdfContainer = document.getElementById('pdfContainer');
            var totalPages = pdf.numPages;
            var containerWidth = pdfContainer.clientWidth - 20; // 减去 padding

            for (var i = 1; i <= totalPages; i++) {
                (function (pageNum) {
                    pdf.getPage(pageNum).then(function (page) {
                        var viewport = page.getViewport({ scale: 1 });
                        var scale = containerWidth / viewport.width;
                        var scaledViewport = page.getViewport({ scale: scale });

                        var canvas = document.createElement('canvas');
                        var context = canvas.getContext('2d');
                        canvas.height = scaledViewport.height;
                        canvas.width = scaledViewport.width;

                        page.render({
                            canvasContext: context,
                            viewport: scaledViewport
                        }).promise.then(function () {
                            pdfContainer.appendChild(canvas);
                        });
                    });
                })(i);
            }
        }
    </script>
